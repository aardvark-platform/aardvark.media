name: Publish
on:
  push:
    branches:
      - main
      - cef-test
    paths:
      - RELEASE_NOTES.md
      - .github/workflows/publish.yml

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  release-check:
    name: Check for Release
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dotnet
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore Tools
        run: dotnet tool restore

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(dotnet aardpack --parse-only)
          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Error: dotnet aardpack --parse-only failed with exit code $EXIT_CODE"
            exit 1
          fi

          if [ -z "$VERSION" ]; then
            echo "Error: dotnet aardpack --parse-only returned an empty string"
            exit 1
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists. Setting skip to true."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Release $VERSION new. Setting skip to false."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  pack:
    name: Package
    runs-on: windows-2022
    needs: release-check
    if: needs.release-check.outputs.should-skip != 'true'
    permissions:
      id-token: write # enable GitHub OIDC token issuance for this job
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dotnet
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore Tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet paket restore

      - name: Restore NuGet Packages for Aardvark.Cef.Process.Core
        run: msbuild src\Aardvark.Cef.Process.Core\Aardvark.Cef.Process.Core.vcxproj -t:restore

      - name: Build Aardvark.Cef.Process.Core
        run: msbuild src\Aardvark.Cef.Process.Core\Aardvark.Cef.Process.Core.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build
        shell: cmd
        run: dotnet build -c Release src\Aardvark.Media.sln

      - name: Test
        run: dotnet test src\Aardvark.Media.sln -c Release --no-build --nologo --logger:"console;verbosity=normal"

      - name: Pack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet aardpack src\Aardvark.Media.sln --skip-build --no-release --no-tag

      - name: Upload Packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: bin\pack
