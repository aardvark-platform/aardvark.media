name: Build

on: 
  push:
    paths-ignore:
    - 'README.md'
    - 'docs/'
  pull_request:
    paths-ignore:
    - 'README.md'
    - 'docs/'
    
jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            os: [ubuntu-latest, windows-latest, macos-latest]
            include:
              - os: ubuntu-latest
                run-build: sh ./build.sh
              - os: windows-latest
                run-build: .\build.cmd
              - os: macos-latest
                run-build: bash ./build.sh

    steps:
    - uses: actions/checkout@v6
    - name: Install Dotnet
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    - name: Build
      run: ${{ matrix.run-build }}
    - name: Install Chromium
      if: runner.os == 'Linux'
      uses: browser-actions/setup-chrome@v2
      id: chromium
      with:
        chrome-version: stable
    - name: GoldenLayout browser regressions
      if: runner.os == 'Linux'
      env:
        AARDVARK_CHROMIUM: ${{ steps.chromium.outputs.chrome-path }}
      run: |
        set -eu
        test -x "$AARDVARK_CHROMIUM"
        for configuration in Debug Release; do
          dotnet test src/Tests/Aardvark.UI.Tests/Aardvark.UI.Tests.fsproj \
            -c "$configuration" --filter 'FullyQualifiedName~GoldenLayout.Browser'
        done