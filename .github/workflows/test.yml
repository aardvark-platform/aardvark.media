name: Test

on:
  workflow_call:
  push:
    paths:
      - 'src/**'
      - 'paket.lock'
      - 'global.json'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'paket.lock'
      - 'global.json'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            os: [ubuntu-latest, windows-latest, macos-latest]
            include:
              - os: ubuntu-latest
                sln: src/Aardvark.Media.NonWindows.slnf
              - os: windows-latest
                sln: src\Aardvark.Media.sln
              - os: macos-latest
                sln: src/Aardvark.Media.NonWindows.slnf

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache Paket
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            paket-files
          key: ${{ runner.os }}-paket-${{ hashFiles('paket.lock') }}
          restore-keys: |
            ${{ runner.os }}-paket-

      - name: Setup MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Restore Tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet paket restore

      - name: Restore NuGet Packages for Aardvark.Cef.Process.Core
        if: runner.os == 'Windows'
        run: msbuild src\Aardvark.Cef.Process.Core\Aardvark.Cef.Process.Core.vcxproj -t:restore

      - name: Build Aardvark.Cef.Process.Core
        if: runner.os == 'Windows'
        run: msbuild src\Aardvark.Cef.Process.Core\Aardvark.Cef.Process.Core.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Build
        run: dotnet build -c Release ${{ matrix.sln }}

      - name: Install Chromium
        if: runner.os == 'Linux'
        uses: browser-actions/setup-chrome@v2
        id: chromium
        with:
          chrome-version: stable

      - name: Gamepad regressions (Debug)
        if: runner.os == 'Linux'
        env:
          AARDVARK_CHROMIUM: ${{ steps.chromium.outputs.chrome-path }}
        run: |
          test -x "$AARDVARK_CHROMIUM"
          dotnet test src/Tests/Aardvark.UI.Tests/Aardvark.UI.Tests.fsproj -c Debug --filter 'FullyQualifiedName~Gamepad Tests' --nologo

      - name: Test
        env:
          AARDVARK_CHROMIUM: ${{ steps.chromium.outputs.chrome-path }}
        run: dotnet test ${{ matrix.sln }} -c Release --no-build --nologo --logger:"console;verbosity=normal"